<!-- Thumbnail generation — plain script, no Three.js dependency -->
<script>
(function() {
  const topBar  = document.getElementById('topBar');
  const topGlow = document.getElementById('topBarGlow');
  const genBtn  = document.getElementById('generateBtn');
  const genPanel = document.getElementById('genPanel');
  const genBar  = document.getElementById('genBar');
  const genLabel = document.getElementById('genLabel');
  const genCount = document.getElementById('genCount');
  const genStatus = document.getElementById('genStatus');

  function setTopBar(pct) {
    topBar.style.width = pct + '%';
    topBar.classList.add('active');
    topGlow.classList.add('active');
  }
  function finishTopBar() {
    setTopBar(100);
    setTimeout(function() {
      topBar.classList.remove('active');
      topGlow.classList.remove('active');
      topBar.style.width = '0%';
    }, 600);
  }
  function showGenPanel(pct, label, count) {
    genPanel.style.display = '';
    genBar.style.width = pct + '%';
    genLabel.textContent = label;
    genCount.textContent = count;
    setTopBar(Math.max(pct, 2));
  }
  function hideGenPanel() {
    finishTopBar();
    setTimeout(function() { genPanel.style.display = 'none'; }, 2000);
  }

  var polling = false;
  function schedulePoll() {
    setTimeout(async function() {
      try {
        var r = await fetch('/api/generate-thumbnails/status');
        var d = await r.json();
        if (d.total > 0) {
          var pct = Math.round((d.done / d.total) * 100);
          showGenPanel(
            pct,
            d.running ? ('Rendering: ' + d.current) : ('Done — ' + (d.total - d.errors.length) + ' / ' + d.total + ' rendered'),
            d.done + ' / ' + d.total
          );
        }
        if (d.running) {
          schedulePoll();
        } else {
          polling = false;
          genBtn.disabled = false;
          if (d.total > 0) {
            hideGenPanel();
            if (genStatus) genStatus.textContent = (d.total - d.errors.length) + ' / ' + d.total + ' rendered';
          }
        }
      } catch(e) { schedulePoll(); }
    }, 800);
  }

  genBtn.addEventListener('click', async function() {
    genBtn.disabled = true;
    showGenPanel(0, 'Starting...', '');
    try {
      var r = await fetch('/api/generate-thumbnails', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ force: false })
      });
      if (!r.ok) throw new Error('Server error ' + r.status);
      if (!polling) { polling = true; schedulePoll(); }
    } catch(e) {
      showGenPanel(0, 'Error: ' + e.message, '');
      genBtn.disabled = false;
    }
  });

  // Resume on page load if job already running
  fetch('/api/generate-thumbnails/status').then(function(r) { return r.json(); }).then(function(d) {
    if (d.running) {
      genBtn.disabled = true;
      var pct = d.total > 0 ? Math.round((d.done / d.total) * 100) : 0;
      showGenPanel(pct, 'Rendering: ' + d.current, d.done + ' / ' + d.total);
      if (!polling) { polling = true; schedulePoll(); }
    }
  });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const STATUS_LABEL = { 'want-to-try': 'Want to Try', testing: 'Testing', keeper: 'Keeper', failed: 'Failed' };
const MATERIAL = () => new THREE.MeshPhongMaterial({ color: 0x4f7fff, specular: 0x333333, shininess: 40 });

// Thumbnails are generated server-side via /api/generate-thumbnails

// Thumbnails are generated server-side via /api/generate-thumbnails

// ── Detail modal viewer ────────────────────────────────────────────────────
const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 2, 0.01, 10000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(5, 10, 7); scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x8888ff, 0.4), { position: new THREE.Vector3(-5, -3, -5) }));

let animId = null;
function startRender() { if (animId) return; function loop() { animId = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); } loop(); }
function stopRender() { if (animId) { cancelAnimationFrame(animId); animId = null; } }
function resizeViewer() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
function clearScene() { for (const c of [...scene.children]) { if (c.isMesh || c.isGroup) { c.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } }); scene.remove(c); } } }
function fitCamera(obj) { const box = new THREE.Box3().setFromObject(obj); const center = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3()); const maxDim = Math.max(size.x, size.y, size.z); obj.position.sub(center); camera.position.set(maxDim, maxDim * 0.6, maxDim * 1.8); controls.target.set(0, 0, 0); controls.update(); }

function loadFile(category, name, filename) {
  clearScene();
  const url = `/api/mods/${encodeURIComponent(category)}/${encodeURIComponent(name)}/file/${encodeURIComponent(filename)}`;
  const ext = filename.split('.').pop().toLowerCase();
  if (ext === 'stl') new STLLoader().load(url, geo => { const m = new THREE.Mesh(geo, MATERIAL()); scene.add(m); fitCamera(m); });
  else if (ext === '3mf') new ThreeMFLoader().load(url, obj => { obj.traverse(c => { if (c.isMesh) c.material = MATERIAL(); }); scene.add(obj); fitCamera(obj); });
}

// ── App state ──────────────────────────────────────────────────────────────
let allMods = [], activeMod = null, activeFilter = 'all', searchQuery = '';

async function loadMods() {
  const r = await fetch('/api/mods');
  allMods = await r.json();
  renderCards();
}

function visibleMods() {
  return allMods.filter(m => {
    if (activeFilter !== 'all' && m.category !== activeFilter) return false;
    if (searchQuery && !m.name.includes(searchQuery.toLowerCase())) return false;
    return true;
  });
}

function thumbUrl(m) { return `/api/mods/${encodeURIComponent(m.category)}/${encodeURIComponent(m.name)}/thumbnail?t=${Date.now()}`; }

function renderCards() {
  const mods = visibleMods();
  document.getElementById('countLabel').textContent = `${mods.length} mod${mods.length !== 1 ? 's' : ''}`;
  document.getElementById('cards').innerHTML = mods.map(m => {
    const idx = allMods.indexOf(m);
    const hasPrintable = m.files.length > 0;
    return `
    <div class="col-6 col-sm-4 col-md-3 col-xl-2">
      <div class="thumb-card" onclick="openMod(${idx})">
        <div id="thumb-${m.category}-${m.name.replace(/[^a-z0-9]/gi,'-')}">
          ${hasPrintable
            ? `<img class="thumb-img" src="/api/mods/${encodeURIComponent(m.category)}/${encodeURIComponent(m.name)}/thumbnail" onerror="this.parentElement.innerHTML='<div class=\\"thumb-placeholder\\">&#9651;</div>'" loading="lazy">`
            : `<div class="thumb-placeholder">&#9651;</div>`}
        </div>
        <div class="thumb-body">
          <div class="thumb-title" title="${m.name}">${m.name}</div>
          <div class="thumb-meta">
            <span class="status-dot dot-${m.status}"></span>
            <span class="cat-pill cat-pill-${m.category}">${m.category}</span>
            ${m.pdf_files && m.pdf_files.length ? `<span class="badge badge-pdf rounded-pill ms-1">PDF</span>` : ''}
            <span class="text-muted ms-auto" style="font-size:.7rem">${m.files.length}f</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Progress bar and thumbnail generation handled by plain script above

// ── Filters ────────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards();
  });
});
document.getElementById('searchBox').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderCards(); });

// ── Detail modal ───────────────────────────────────────────────────────────
window.openMod = function(i) {
  activeMod = allMods[i];
  document.getElementById('modTitle').textContent = activeMod.name;
  const catBadge = document.getElementById('modCatBadge');
  catBadge.textContent = activeMod.category;
  catBadge.className = `badge rounded-pill mt-1 cat-pill cat-pill-${activeMod.category}`;
  document.getElementById('statusSelect').value = activeMod.status;
  document.getElementById('notesArea').value = activeMod.notes;
  document.getElementById('sourceUrl').value = activeMod.source_url;
  const link = document.getElementById('sourceLink');
  if (activeMod.source_url) { link.href = activeMod.source_url; link.style.display = ''; } else { link.style.display = 'none'; }

  document.getElementById('fileList').innerHTML = activeMod.files.length
    ? activeMod.files.map(f => `<div class="file-item"><span class="file-name" data-file="${f}" onclick="selectFile('${f}')">${f}</span><button class="btn btn-outline-secondary btn-orca" onclick="openInSlicer('${f}','orca')">Open in OrcaSlicer</button><button class="btn btn-outline-secondary btn-orca" onclick="openInSlicer('${f}','cura')">Open in Cura</button><button class="btn btn-outline-secondary btn-orca" onclick="openInSlicer('${f}','bambu')">Open in Bambu</button><button class="btn btn-outline-primary btn-orca btn-slicer-default" onclick="openInDefaultSlicer('${f}')">Open</button></div>`).join('')
    : '<div class="text-muted small">No printable files.</div>';

  const ss = document.getElementById('sourceSection'), sl = document.getElementById('sourceList');
  if (activeMod.source_files.length) { sl.innerHTML = activeMod.source_files.map(f => `<div class="source-file py-1">${f}</div>`).join(''); ss.style.display = ''; }
  else ss.style.display = 'none';

  // ── Documentation section ──────────────────────────────────────────────────
  const pdfs = activeMod.pdf_files || [];
  const docsSection = document.getElementById('docsSection');
  const docsList = document.getElementById('docsList');
  if (pdfs.length) {
    docsList.innerHTML = pdfs.map((f, idx) => `
      <div class="file-item">
        <span class="source-file" style="flex:1">${f}</span>
        <button class="btn btn-sm btn-outline-warning" onclick="openDocsPanel(${idx})">View PDF</button>
      </div>`).join('');
    docsSection.style.display = '';
  } else { docsSection.style.display = 'none'; }

  new bootstrap.Modal(document.getElementById('modModal')).show();
  document.getElementById('modModal').addEventListener('shown.bs.modal', () => {
    resizeViewer(); startRender();
    if (activeMod.files.length) selectFile(activeMod.files[0]);
  }, { once: true });
};

window.selectFile = function(filename) {
  document.querySelectorAll('.file-name').forEach(el => el.classList.toggle('active', el.dataset.file === filename));
  if (/\.(stl|3mf)$/i.test(filename)) loadFile(activeMod.category, activeMod.name, filename);
  else clearScene();
};

function _docsSetWidth(w) {
  document.documentElement.style.setProperty('--docs-panel-w', w + 'px');
  document.body.classList.toggle('docs-panel-wide', w > window.innerWidth * 0.7);
}

window.snapDocsPanel = function() {
  const panel = document.getElementById('docsPanel');
  panel.style.width = '';
  requestAnimationFrame(() => _docsSetWidth(panel.offsetWidth));
};

window.openDocsPanel = function(startIdx) {
  const pdfs = activeMod.pdf_files || [];
  if (!pdfs.length) return;
  const pdfUrl = f => `/api/mods/${encodeURIComponent(activeMod.category)}/${encodeURIComponent(activeMod.name)}/file/${encodeURIComponent(f)}`;
  document.getElementById('docsPanelTitle').textContent = activeMod.name;
  const frame = document.getElementById('docsPanelFrame');
  const sel = document.getElementById('docsPanelSelect');
  frame.src = pdfUrl(pdfs[startIdx || 0]);
  if (pdfs.length > 1) {
    sel.style.display = '';
    sel.innerHTML = pdfs.map((f, i) => `<option value="${i}"${i === (startIdx||0) ? ' selected' : ''}>${f}</option>`).join('');
    sel.onchange = () => { frame.src = pdfUrl(pdfs[+sel.value]); };
  } else { sel.style.display = 'none'; }
  const panel = document.getElementById('docsPanel');
  panel.classList.remove('collapsed');
  panel.classList.add('open');
  document.getElementById('docsCollapseBtn').textContent = '❯';
  document.getElementById('docsBd').classList.add('open');
  requestAnimationFrame(() => {
    _docsSetWidth(panel.offsetWidth);
    document.body.classList.add('docs-panel-open');
  });
};

window.closeDocsPanel = function() {
  const panel = document.getElementById('docsPanel');
  panel.classList.remove('open', 'collapsed');
  document.getElementById('docsBd').classList.remove('open');
  document.getElementById('docsCollapseBtn').textContent = '❯';
  document.body.classList.remove('docs-panel-open', 'docs-panel-wide');
  panel.style.width = '';
  setTimeout(() => { document.getElementById('docsPanelFrame').src = ''; }, 300);
};

window.toggleDocsCollapse = function() {
  const panel = document.getElementById('docsPanel');
  const btn = document.getElementById('docsCollapseBtn');
  const isCollapsed = panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', !isCollapsed);
  btn.textContent = isCollapsed ? '❯' : '❮';
  if (isCollapsed) {
    _docsSetWidth(panel.offsetWidth);
    document.body.classList.add('docs-panel-open');
  } else {
    document.body.classList.remove('docs-panel-open', 'docs-panel-wide');
  }
};

// ── Drag to resize docs panel ──────────────────────────────────────────────
(function() {
  const handle = document.getElementById('docsDragHandle');
  const panel  = document.getElementById('docsPanel');
  let dragging = false, startX, startW;
  handle.addEventListener('mousedown', e => {
    if (e.target.id === 'docsCollapseBtn' || e.target.id === 'docsSnapBtn') return;
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    panel.style.transition = 'none';
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'ew-resize';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.min(Math.max(startW + (startX - e.clientX), 280), window.innerWidth * 0.92);
    panel.style.width = w + 'px';
    _docsSetWidth(w);
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });
})();

window.openInSlicer = async function(filename, slicer) {
  const r = await fetch(`/api/mods/${encodeURIComponent(activeMod.category)}/${encodeURIComponent(activeMod.name)}/open/${encodeURIComponent(filename)}?slicer=${slicer}`, { method: 'POST' });
  if (!r.ok) { const d = await r.json(); alert(d.error || `Could not open ${slicer === 'cura' ? 'Cura' : 'OrcaSlicer'}`); }
};
window.openInOrca = filename => openInSlicer(filename, 'orca');

// ── Default slicer preference ──────────────────────────────────────────────
const _defSlicerSel = document.getElementById('defaultSlicerSelect');
_defSlicerSel.value = localStorage.getItem('defaultSlicer') || 'orca';
_defSlicerSel.addEventListener('change', () => localStorage.setItem('defaultSlicer', _defSlicerSel.value));
window.openInDefaultSlicer = f => openInSlicer(f, localStorage.getItem('defaultSlicer') || 'orca');

document.getElementById('modModal').addEventListener('hidden.bs.modal', () => {
  stopRender(); clearScene();
});
document.getElementById('sourceUrl').addEventListener('input', function() { const l = document.getElementById('sourceLink'); if (this.value) { l.href = this.value; l.style.display = ''; } else l.style.display = 'none'; });

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!activeMod) return;
  await fetch(`/api/mods/${encodeURIComponent(activeMod.category)}/${encodeURIComponent(activeMod.name)}/meta`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: document.getElementById('statusSelect').value, notes: document.getElementById('notesArea').value, source_url: document.getElementById('sourceUrl').value }),
  });
  await loadMods();
  bootstrap.Modal.getInstance(document.getElementById('modModal')).hide();
});

// ── Drag & drop ────────────────────────────────────────────────────────────
let dragCounter = 0;
const dropOverlay = document.getElementById('dropOverlay');
document.addEventListener('dragenter', e => {
  if ([...(e.dataTransfer?.items||[])].some(i => i.kind === 'file')) { dragCounter++; dropOverlay.classList.add('active'); }
});
document.addEventListener('dragleave', () => { if (--dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragCounter = 0; dropOverlay.classList.remove('active');
  const file = [...(e.dataTransfer?.files||[])].find(f => f.name.toLowerCase().endsWith('.zip'));
  if (file) { setImportFile(file); new bootstrap.Modal(document.getElementById('importModal')).show(); }
});

const modalDropZone = document.getElementById('modalDropZone');
modalDropZone.addEventListener('dragover', e => { e.preventDefault(); modalDropZone.classList.add('drag-over'); });
modalDropZone.addEventListener('dragleave', () => modalDropZone.classList.remove('drag-over'));
modalDropZone.addEventListener('drop', e => {
  e.preventDefault(); modalDropZone.classList.remove('drag-over');
  const file = [...(e.dataTransfer?.files||[])].find(f => f.name.toLowerCase().endsWith('.zip'));
  if (file) setImportFile(file);
});

function setImportFile(file) {
  const dt = new DataTransfer(); dt.items.add(file);
  document.getElementById('importFile').files = dt.files;
  const n = document.getElementById('importName');
  if (!n.value) n.value = file.name.replace(/\.zip$/i, '').replace(/[_\s]+/g, '-').toLowerCase();
  document.getElementById('selectedFileName').textContent = file.name;
}
document.getElementById('importFile').addEventListener('change', function() { if (this.files[0]) setImportFile(this.files[0]); });

function closeImportModal() {
  bootstrap.Modal.getInstance(document.getElementById('importModal'))?.hide();
  ['importName','importUrl','importDownloadUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('importFile').value = '';
  document.getElementById('selectedFileName').textContent = '';
  document.getElementById('importStatus').textContent = '';
}

document.getElementById('importBtn').addEventListener('click', async () => {
  const category = document.getElementById('importCategory').value;
  const name     = document.getElementById('importName').value.trim();
  const srcUrl   = document.getElementById('importUrl').value.trim();
  const file     = document.getElementById('importFile').files[0];
  const status   = document.getElementById('importStatus');
  if (!file) { status.textContent = 'Drop or select a zip first.'; status.className = 'mt-2 small text-warning'; return; }
  status.textContent = 'Importing...'; status.className = 'mt-2 small text-muted';
  const fd = new FormData();
  fd.append('file', file); fd.append('category', category); if (name) fd.append('name', name);
  const r = await fetch('/api/import', { method: 'POST', body: fd });
  if (r.ok) {
    const d = await r.json();
    if (srcUrl) await fetch(`/api/mods/${encodeURIComponent(d.category)}/${encodeURIComponent(d.name)}/meta`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source_url: srcUrl }),
    });
    await loadMods(); closeImportModal();
  } else { status.textContent = 'Import failed.'; status.className = 'mt-2 small text-danger'; }
});

document.getElementById('fetchBtn').addEventListener('click', async () => {
  const dlUrl    = document.getElementById('importDownloadUrl').value.trim();
  const srcUrl   = document.getElementById('importUrl').value.trim();
  const category = document.getElementById('importCategory').value;
  const name     = document.getElementById('importName').value.trim();
  const status   = document.getElementById('importStatus');
  const btn      = document.getElementById('fetchBtn');
  if (!dlUrl) { status.textContent = 'Enter a URL first.'; status.className = 'mt-2 small text-warning'; return; }
  status.textContent = 'Downloading...'; status.className = 'mt-2 small text-muted'; btn.disabled = true;
  const r = await fetch('/api/fetch-zip', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: dlUrl, category, name, source_url: srcUrl }),
  });
  btn.disabled = false;
  if (r.ok) { await loadMods(); closeImportModal(); }
  else { status.textContent = 'Download failed — is this a direct .zip link?'; status.className = 'mt-2 small text-danger'; }
});

loadMods();
</script>

<!-- Docs slide-out panel -->
<div id="docsBd" onclick="closeDocsPanel()"></div>
<div id="docsPanel">
  <div id="docsDragHandle">
    <button id="docsCollapseBtn" onclick="toggleDocsCollapse()" title="Collapse panel">❯</button>
    <button id="docsSnapBtn" onclick="snapDocsPanel()" title="Reset to 50%">⊡</button>
  </div>
  <div id="docsPanelContent">
    <div class="d-flex align-items-center gap-2 px-3 py-2" style="border-bottom:1px solid #2a2d3e;flex-shrink:0">
      <span id="docsPanelTitle" class="fw-semibold text-truncate" style="flex:1;font-size:.9rem;color:#fff"></span>
      <select id="docsPanelSelect" class="form-select form-select-sm me-1" style="display:none;width:auto;max-width:180px"></select>
      <button class="btn-close btn-close-white" onclick="closeDocsPanel()"></button>
    </div>
    <iframe id="docsPanelFrame" title="Documentation"></iframe>
  </div>
</div>
</body>
</html>
